{% extends "auth/base.html" %}
{% block title %}Register — Career Search Guide{% endblock %}
{% block content %}
<h1>Create account</h1>
{% if error %}
<p class="auth-error">{{ error }}</p>
{% endif %}
<form method="post" action="/register" class="auth-form">
  {% include "shared/partials/csrf_input.html" %}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>

  <label for="password_confirm">Confirm password</label>
  <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>

  <button type="submit">Create account</button>
</form>
<p class="auth-links"><a href="/login">Already have an account? Log in</a></p>
{% endblock %}
